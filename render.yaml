        value: "120363404823253263@newsletter"
      - key: WHATSAPP_CHANNEL_LINK
        value: "https://whatsapp.com/channel/0029VbC6FsH3wtb5UEDvrW0a"
      - key: CHECK_INTERVAL_MINUTES
        value: "2"
      - key: CREDS_BASE64
        sync: false
